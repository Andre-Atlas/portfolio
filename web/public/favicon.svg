<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The entry scene's neuron as a mark: gyroscope rings round a nucleus, electrons on the rings, circuit dendrites. -->
  <rect width="64" height="64" rx="14" fill="#0b0b0c"/>
  <g fill="none" stroke="#f2f2f2" stroke-linecap="round">
    <!-- dendrites: circuit traces with end pads -->
    <path d="M32 9v6M32 49v6M9 32h6M49 32h6" stroke-width="2.4" opacity=".55"/>
    <!-- gyroscope rings -->
    <ellipse cx="32" cy="32" rx="19" ry="8" stroke-width="2.6" transform="rotate(-30 32 32)"/>
    <ellipse cx="32" cy="32" rx="19" ry="8" stroke-width="2.6" transform="rotate(30 32 32)" opacity=".75"/>
    <circle cx="32" cy="32" r="19" stroke-width="1.6" opacity=".35"/>
  </g>
  <g fill="#f2f2f2">
    <circle cx="32" cy="7" r="2.6" opacity=".7"/><circle cx="32" cy="57" r="2.6" opacity=".7"/>
    <circle cx="7" cy="32" r="2.6" opacity=".7"/><circle cx="57" cy="32" r="2.6" opacity=".7"/>
    <!-- electrons riding the rings -->
    <circle cx="48.5" cy="22.5" r="3"/>
    <circle cx="15.5" cy="22.5" r="2.4" opacity=".8"/>
    <!-- nucleus -->
    <circle cx="32" cy="32" r="6"/>
  </g>
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#f2f2f2" stroke-width="1.4" opacity=".5"/>
</svg>
